:root{color-scheme:dark;--bg:#0d1324;--pad:#2a2f42;--btn:#b02a68}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:#fff;font:16px/1.3 PX,monospace;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr{position:relative;width:min(100vw,calc((100dvh - 250px) * 160 / 144),640px);aspect-ratio:160/144;background:#345c8a}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:#0b1830d9;padding:10px;font-family:PX,monospace}
.ov[hidden]{display:none}
.ov h1{font:32px/1.25 PX,monospace;margin:0;color:#ffd84a;font-weight:normal}
.ov p{margin:0;font-size:16px}
.y{color:#ffd84a}
.ctl{width:min(100vw,440px);flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;align-items:center;padding:12px 18px 18px;max-height:280px}
.dpad{position:relative;width:138px;height:138px}
.dpad button{position:absolute;width:46px;height:46px;background:var(--pad);border:0;border-radius:6px;padding:0;color:#5c6380;font:16px PX,monospace}
.dpad .u{left:46px;top:0}.dpad .d{left:46px;top:92px}.dpad .l{left:0;top:46px}.dpad .r{left:92px;top:46px}
.dpad .c{position:absolute;left:46px;top:46px;width:46px;height:46px;background:var(--pad)}
.ab{position:relative;height:138px;transform:rotate(-22deg)}
.ab button{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--btn);border:0;box-shadow:0 4px 0 #6a1239;color:#ffd6e8;font:24px PX,monospace}
.ab .b{left:0;top:52px}.ab .a{right:0;top:22px}
.ss{grid-column:1/3;display:flex;justify-content:center;gap:22px}
.ss button{min-width:72px;height:24px;border-radius:12px;background:var(--pad);border:0;color:#8d93ad;font:16px PX,monospace;padding:0 10px}
button:active,button.on{filter:brightness(1.5);transform:translateY(2px)}
button:focus-visible{outline:2px solid #ffd84a}
</style>

<body>
  <div class="scr">
    <canvas id="c" width="160" height="144"></canvas>
    <div class="ov" id="ov">
      <h1>ครูวรุฒ<br>ผจญภัยอวกาศ</h1>
      <p class="y">กด START</p>
    </div>
  </div>
  <div class="ctl">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="ขึ้น">▲</button>
      <button class="l" data-k="left" aria-label="ซ้าย">◀</button>
      <div class="c"></div>
      <button class="r" data-k="right" aria-label="ขวา">▶</button>
      <button class="d" data-k="down" aria-label="ลง">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" aria-label="B">B</button>
      <button class="a" data-k="a" aria-label="A">A</button>
    </div>
    <div class="ss"><button data-k="select">SELECT</button><button data-k="start">START</button></div>
  </div>
<script>
{
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const ov = document.getElementById('ov'), led = {classList:{add(){},remove(){}}};
const atlas = new Image();
let sabers = [];   // atlas copies with the blade in different glow colours
function makeSabers(){
  const glow = [[60,255,110],[190,255,200],[30,210,80],[120,255,160]];
  sabers = glow.map(c => {
    const cc = document.createElement('canvas'); cc.width = atlas.width; cc.height = atlas.height;
    const x = cc.getContext('2d'); x.drawImage(atlas, 0, 0);
    const im = x.getImageData(0, 0, cc.width, cc.height), d = im.data;
    for(let i=0;i<d.length;i+=4) if(d[i]===60 && d[i+1]===200 && d[i+2]===90){ d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; }
    x.putImageData(im, 0, 0); return cc;
  });

// ---------- input
const K = {left:0,right:0,up:0,down:0,a:0,b:0,start:0,select:0};
const P = {};  // pressed this frame
function press(k, v){ if(v && !K[k]) P[k] = 1; K[k] = v; }
const keymap = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyS:'down',KeyW:'up',KeyZ:'a',Space:'a',KeyX:'b',KeyJ:'b',Enter:'start',ShiftRight:'select'};
addEventListener('keydown', e => { const k = keymap[e.code]; if(k){ press(k,1); e.preventDefault(); } });
addEventListener('keyup', e => { const k = keymap[e.code]; if(k){ press(k,0); e.preventDefault(); } });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); b.classList.add('on'); press(k,1); audioInit(); };
  const off = e => { b.classList.remove('on'); press(k,0); };
  b.addEventListener('pointerdown', on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(t => b.addEventListener(t, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

// ---------- sound
let ac = null;
function audioInit(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state === 'suspended') ac.resume(); }
addEventListener('keydown', audioInit, {once:true});
function snd(f1, f2, dur, type='square', vol=.08){
  if(!ac) return;
  try{
    const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+dur);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}

// ---------- level
const T = 16, COLS = 63, ROWS = 8, LW = COLS*T, GY = 112;
const PITS = [[9,10],[20,21],[35,36],[45,47]];
const BLOCKS = [[5,4],[6,4],[7,4],[10,2],[11,2],[14,3],[15,3],[18,4],[19,4],[20,4],[21,4],[24,3],[25,3],
  [30,4],[31,4],[34,3],[35,3],[36,3],[37,3],[40,4],[41,4],[43,2],[44,2],[46,4],[47,4],[48,4],[51,3],[52,3],[53,3]];
let map;
function buildMap(){
  map = Array.from({length:ROWS}, () => new Array(COLS).fill(0));
  for(let c=0;c<COLS;c++) if(!PITS.some(([a,b]) => c>=a && c<=b)) map[7][c] = 1;
  BLOCKS.forEach(([c,r]) => map[r][c] = 2);
}
function solid(px, py){
  const c = Math.floor(px/T), r = Math.floor(py/T);
  if(c < 0 || c >= COLS) return true;
  if(r < 0 || r >= ROWS) return false;
  return map[r][c] > 0;
}
const DOOR_X = 59*T + 28;

// ---------- player physics
function movePlayer(){
  const p = pl;
  let crouch = K.down && p.on;
  if(crouch && p.h === 22){ p.y += 6; p.h = 16; }
  if(!crouch && p.h === 16){
    if(p.on && (solid(p.x+1, p.y-6) || solid(p.x+p.w-1, p.y-6))) crouch = true;   // no headroom: stay down
    else { p.y -= 6; p.h = 22; }
  }
  p.cr = crouch ? p.cr+1 : 0;
  let ax = 0;
  if(!crouch && p.hurt < 12){ if(K.left) ax -= 1; if(K.right) ax += 1; }
  if(ax){ p.vx += ax*.18; p.face = ax; } else p.vx *= p.on ? .75 : .95;
  const max = 1.45;
  p.vx = Math.max(-max, Math.min(max, p.vx));
  if(Math.abs(p.vx) < .05) p.vx = 0;
  if(P.a && p.on && !crouch){ p.vy = -5.5; p.on = false; p.jumpHeld = true; snd(300, 700, .15); }
  if(!K.a && p.jumpHeld && p.vy < -2){ p.vy *= .5; p.jumpHeld = false; }
  if(p.vy >= 0) p.jumpHeld = false;
  if(P.b && !p.atk){ p.atk = 24; snd(900, 200, .12, 'sawtooth', .05); }
  p.vy = Math.min(4, p.vy + .22);
  // x
  p.x += p.vx;
  if(p.vx > 0 && (solid(p.x+p.w, p.y+1) || solid(p.x+p.w, p.y+p.h-1) || solid(p.x+p.w, p.y+p.h/2))){ p.x = Math.floor((p.x+p.w)/T)*T - p.w - .01; p.vx = 0; }
  if(p.vx < 0 && (solid(p.x, p.y+1) || solid(p.x, p.y+p.h-1) || solid(p.x, p.y+p.h/2))){ p.x = Math.floor(p.x/T+1)*T + .01; p.vx = 0; }
  // y
  p.y += p.vy; p.on = false;
  if(p.vy > 0 && (solid(p.x+1, p.y+p.h) || solid(p.x+p.w-1, p.y+p.h))){ p.y = Math.floor((p.y+p.h)/T)*T - p.h; p.vy = 0; p.on = true; }

}
function breakBlock(c, r){

function updEnemies(){

  for(const e of en){
    if(!e.alive) continue;
    if(e.t === 'g'){
      e.vy = Math.min(4, e.vy + .22);
      e.x += e.vx;
      const fx = e.vx > 0 ? e.x+e.w : e.x;
      if(solid(fx, e.y+e.h/2) || !solid(fx, e.y+e.h+2)) { e.x -= e.vx; e.vx *= -1; }
      e.y += e.vy;
      if(solid(e.x+2, e.y+e.h) || solid(e.x+e.w-2, e.y+e.h)){ e.y = Math.floor((e.y+e.h)/T)*T - e.h; e.vy = 0; }

  }

// ---------- chiptune music (Thai number notation: 1-7 = do..ti, 8/9 = high do/re, n* = octave up, - = hold)
const SONG = `---- 9999 --76 5679 -7-- 93*-9 -796 7653 x%2
-723 2523 2723 2356 -723 2356 53-5 -555 x%2
-7-5 67-6 ---5 -3-- -2-7 -6-7 -3-5 5555 x%2`;
const DEG = {1:0, 2:2, 3:4, 4:5, 5:7, 6:9, 7:11, 8:12, 9:14};
function tokens(str){                     // spaces don't count: "-9-3*" -> [-,9,-,3*]
  const out = [], t = str.replace(/\s+/g, '');
  for(let i=0;i<t.length;i++){
    const ch = t[i];
    if(ch === '-'){ out.push(null); continue; }
    if(!(ch in DEG)) continue;
    let st = DEG[ch];
    if(t[i+1] === '*'){ st += 12; i++; }
    out.push(st);
  }
  return out;
}
function parseSong(src){
  const steps = [];
  let chord = 0;                                 // tonic until the first group's 4th note
  for(const part of src.split(/(x%\d+)/)){
    if(/^x%/.test(part)) continue;
    const rep = +((src.split(part)[1] || '').match(/^\s*x%(\d+)/) || [0, 1])[1];
    const tk = tokens(part);
    if(!tk.length) continue;
    for(let r=0;r<rep;r++)
      for(let g0=0; g0<tk.length; g0+=4){
        const grp = tk.slice(g0, g0+4);
        // chord of this group = its 4th note (or the note still sounding there); it takes over ON the 4th note
        const c4 = [...grp].reverse().find(n => n !== null);
        grp.forEach((n, k) => {
          const change = k === 3 && c4 !== undefined;
          if(change) chord = c4;
          steps.push({n, chord, change, beat: k, sec: g0 === 0 && k === 0, bar: (g0/4 + (k === 3 ? 1 : 0)) % 2});   // sec = a section (or its repeat) begins: '-' there is a rest
        });
      }
  }
  return steps;
}
// chord colours per root (semitones above G); variant alternates bar by bar inside each section
const IV = {maj:[0,4,7], min:[0,3,7], dim:[0,3,6], maj7:[0,4,7,11], add9:[0,4,7,14], madd9:[0,3,7,14], sus4:[0,5,7], maj7inv:[0,3,7,8]};
const PALETTE = {
  0:  [['maj7','Gmaj7'], ['add9','Gadd9']],
  2:  [['min','Am'], ['madd9','Amadd9']],
  4:  [['min','Bm'], ['sus4','Bsus4','min']],
  5:  [['maj7','Cmaj7'], ['add9','Cadd9']],
  7:  [['sus4','Dsus4','maj'], ['maj7','Dmaj7']],
  9:  [['madd9','Emadd9'], ['min','Em']],
  11: [['maj7inv','Dmaj7/F#'], ['maj7inv','Dmaj7/F#']],   // F#dim recoloured as Dmaj7 over F#
};
function chordTones(root, variant, since){
  const [q, name, res] = PALETTE[root % 12][variant];
  const kind = res && since >= 2 ? res : q;          // sus4 resolves after one beat
  return IV[kind].map(x => (root % 12) + x);
}
const STEPS = parseSong(SONG);
const STEP = 0.19, LEAD_BASE = 67, BASS_BASE = 43;   // G major-ish, 8th-note grid
let mus = null, musicOn = true;
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function pulseWave(duty){
  const n = 32, re = new Float32Array(n), im = new Float32Array(n);
  for(let k=1;k<n;k++) im[k] = 2 / (k*Math.PI) * Math.sin(k*Math.PI*duty);
  return ac.createPeriodicWave(re, im);
}
function musicStart(){

    const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = nb.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    mus = {out, noise: nb, p25: pulseWave(.25), p50: pulseWave(.5), p12: pulseWave(.125), i: 0, t: 0, timer: 0, last: null};
  }
  if(mus.timer) return;
  mus.t = ac.currentTime + .05; mus.i = 0; mus.last = null;
  mus.out.gain.setValueAtTime(musicOn ? .55 : 0, ac.currentTime);
  mus.timer = setInterval(schedule, 25);
}
function musicStop(){ if(mus && mus.timer){ clearInterval(mus.timer); mus.timer = 0; } }
const DEATH = tokens('-9-3* -9-7 ---6 ---5');
function deathJingle(){

  if(!mus) { musicStart(); musicStop(); }
  let t = ac.currentTime + .08, d = .15;
  const durs = DEATH.map(() => { const x = d; d *= 1.09; return x; });   // ritardando: each step a little slower
  DEATH.forEach((n, i) => {
    if(n !== null){
      let len = 0, j = i; do { len += durs[j]; j++; } while(j < DEATH.length && DEATH[j] === null);
      tone(mus.p25, mtof(LEAD_BASE + n), t, len*.95, .12, true);
      tone(mus.p50, mtof(LEAD_BASE + n - 12), t, len*.95, .05);
      tone('triangle', mtof(BASS_BASE + (n % 12)), t, len*.9, .2);
    }
    t += durs[i];
  });
}
function setMusic(on){ musicOn = on; if(mus) mus.out.gain.setTargetAtTime(on ? .55 : 0, ac.currentTime, .05); }
function tone(wave, freq, t, dur, vol, vib){
  const o = ac.createOscillator(), v = ac.createGain();
  if(typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(freq, t);
  if(vib && dur > .35){
    const l = ac.createOscillator(), lg = ac.createGain();
    l.frequency.value = 6; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(freq*.012, t+dur*.6);
    l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur);
  }
  v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vol, t+.006);
  v.gain.setValueAtTime(vol*.7, t+.05); v.gain.linearRampToValueAtTime(vol*.55, t+dur*.9); v.gain.linearRampToValueAtTime(0, t+dur);
  o.connect(v); v.connect(mus.out); o.start(t); o.stop(t+dur+.02);
}
function noiseHit(t, dur, vol, freq, type){
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
  s.buffer = mus.noise; f.type = type; f.frequency.value = freq;
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.001, t+dur);
  s.connect(f); f.connect(v); v.connect(mus.out); s.start(t, Math.random()*.5); s.stop(t+dur);
}
function kick(t){
  const o = ac.createOscillator(), v = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t+.12);
  v.gain.setValueAtTime(.5, t); v.gain.exponentialRampToValueAtTime(.001, t+.14);
  o.connect(v); v.connect(mus.out); o.start(t); o.stop(t+.15);
}
function schedule(){
  while(mus.t < ac.currentTime + .15){
    const i = mus.i % STEPS.length, s = STEPS[i], t = mus.t;
    if(s.n !== null){
      let len = 1; while(len < 16 && STEPS[(i+len) % STEPS.length].n === null && !STEPS[(i+len) % STEPS.length].sec) len++;
      const f = mtof(LEAD_BASE + s.n), dur = len*STEP*.95;
      tone(mus.p25, f, t, dur, .11, true);                         // lead
      tone(mus.p50, f/2, t + STEP*.5, Math.min(dur, STEP*1.5), .035); // echo an octave down
    }
    // chord: chiptune arpeggio (up to 4 tones: maj7 / add9 / sus4) + bass, switching on the 4th note of every group
    if(s.change) mus.since = 0; else mus.since = (mus.since || 0) + 1;
    const ct = chordTones(s.chord, s.bar, mus.since);
    for(let k=0;k<4;k++) tone(mus.p12, mtof(LEAD_BASE - 12 + ct[k % ct.length]), t + k*STEP/4, STEP/4*.9, .045);
    const br = BASS_BASE + (s.chord % 12);
    tone('triangle', mtof(br + (s.change || i % 2 === 0 ? 0 : 12)), t, STEP*.8, s.change ? .3 : .22);
    // downbeat = the 4th note of each Thai group (bar of 2/4 starts there)
    const b = (i + 1) % 4;
    if(b === 0) kick(t);
    if(b === 2) noiseHit(t, .16, .22, 1800, 'bandpass');            // snare on beat 2
    noiseHit(t, .035, b % 2 ? .07 : .1, 7000, 'highpass');           // hat
    if(i % 32 === 3) noiseHit(t, .4, .1, 5000, 'highpass');          // crash on the phrase's first downbeat
    mus.t += STEP; mus.i++;
  }
}

// ---------- states
state = 'title';
resetLevel(true);
function showOv(html){ ov.innerHTML = html; ov.hidden = false; }
function startGame(full){ resetLevel(full); state = 'play'; ov.hidden = true; led.classList.add('on'); audioInit(); musicStart(); }
let paused = false;

function step(){
  if(P.select){ audioInit(); setMusic(!musicOn); if(musicOn) musicStart(); }
  if(state === 'title' || state === 'over' || state === 'won'){
    if(P.start || P.a){ startGame(true); }
  } else if(paused){
    if(P.start){ paused = false; ov.hidden = true; }
  } else {
    if(P.start && state === 'play'){ paused = true; showOv('<h1>หยุดชั่วคราว</h1><p class="y">กด START</p>'); }
    tick++;
    if(state === 'play'){
      movePlayer();
      if(tick % 40 === 0){ timeLeft--; if(timeLeft <= 0) killPlayer(false); }
      if(pl.on && pl.x + pl.w/2 >= DOOR_X){ state = 'win'; pl.vx = 0; pl.face = 1; score += timeLeft*10 + pl.hp*500; snd(523, 1046, .5, 'triangle', .1); }
    } else if(state === 'dead'){
      deadT++;
      if(deadT === 340){
        lives--;
        if(lives > 0){ startGame(false); }
        else { state = 'over'; led.classList.remove('on'); showOv(`<h1>GAME OVER</h1><p>คะแนน ${score}</p><p class="y">กด START</p>`); }
      }
    } else if(state === 'win'){
      winT++;
      if(winT === 150){ state = 'won'; showOv(`<h1>ถึงฐานอวกาศแล้ว!</h1><p>คะแนน ${score}</p><p>ดาว ${starCount}/${stars.length}</p><p class="y">กด START</p>`); }
    }
    updEnemies();
    const target = pl.x + pl.w/2 - 72;
    camX = Math.max(0, Math.min(LW - 160, state === 'play' ? Math.max(camX - 3, Math.min(camX + 3, target)) : camX));
  }
  for(const k in P) delete P[k];
}
function draw(){
  drawBG(); drawMap(); drawEnemies(); drawPlayer(); drawHUD();
}
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while(acc >= 1000/60){ step(); acc -= 1000/60; }
  if(atlas.complete) draw();
  requestAnimationFrame(loop);
}
atlas.onload = () => { makeSabers(); requestAnimationFrame(loop); };
}
</script>
