<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระนาดทุ้มมือถือ (ใหม่)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: 'Sarabun', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas {
      display: block;
      cursor: pointer;
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      transition: opacity 0.25s ease-in-out;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body class="relative w-full h-full">

  <canvas id="keysCanvas" class="w-full h-full"></canvas>

  <button id="openPanelBtn" class="fixed bottom-5 right-5 z-20 flex items-center gap-2 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-semibold py-3 px-5 rounded-full shadow-lg hover:shadow-xl transition-all duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    <span>เปลี่ยนชุดโน้ต</span>
  </button>

  <div id="noteModal" class="fixed inset-0 z-30 modal-backdrop flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in fade-in zoom-in-95 duration-200">
      
      <!-- Modal Header -->
      <div class="bg-amber-600 text-white px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
          </svg>
          <h2 class="text-lg font-bold">เลือกชุดโน้ต (17 โน้ต)</h2>
        </div>
        <button id="closePanelBtn" class="text-white hover:bg-amber-700 p-1.5 rounded-lg transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Content Body -->
      <div class="p-6 overflow-y-auto custom-scrollbar space-y-4">
        <p class="text-sm text-gray-600">กรุณาเลือกชุดเสียงที่ต้องการใช้งาน:</p>
        
        <div class="grid grid-cols-1 gap-3" id="presetButtonsContainer">
          <!-- Dynamically populated preset buttons -->
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="bg-gray-50 border-t border-gray-200 px-6 py-4 flex justify-end">
        <button id="cancelModalBtn" class="px-5 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200 rounded-lg transition-colors">
          ปิด
        </button>
      </div>

    </div>
  </div>

  <script>
    
    // Thai Fine Arts Department (กรมศิลปากร) Base Scale Frequencies (Hz)
    const FINE_ARTS_BASE_FREQ = {
      'ด': 230.3,
      'ร': 254.2,
      'ม': 280.7,
      'ฟ': 309.9,
      'ซ': 342.2,
      'ล': 377.8,
      'ท': 417.2
    };

    /**
     * Converts Thai note symbol to frequency:
     * Removes diacritics including Phinthu (\u0E3A / \u0E38) and Nikhahit (\u0E4D).
     * - Low Octave (contains dot below) -> Base Freq / 2
     * - High Octave (contains dot above) -> Base Freq * 2
     * - Middle Octave -> Base Freq
     */
    function getFrequencyForThaiNote(noteStr) {
      if (!noteStr) return null;
      
      const cleanNote = noteStr.trim();
      // Clean base letter by stripping Phinthu (\u0E3A, \u0E38) and Nikhahit (\u0E4D)
      const baseChar = cleanNote.replace(/[\u0E38\u0E3A\u0E4D]/g, '').trim(); 
      const baseFreq = FINE_ARTS_BASE_FREQ[baseChar];

      if (!baseFreq) return null;

      if (cleanNote.includes('\u0E3A') || cleanNote.includes('\u0E38') || cleanNote.includes('ฺ')) {
        // Low Octave (Divide by 2)
        return baseFreq / 2;
      } else if (cleanNote.includes('\u0E4D') || cleanNote.includes('ํ')) {
        // High Octave (Multiply by 2)
        return baseFreq * 2;
      } else {
        // Middle Octave
        return baseFreq;
      }
    }

    // Audio Context & Sound Synthesizer setup
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    /**
     * Synthesizes an enhanced Kalimba sound.
     * For low notes (< 200 Hz), harmonic overtones and gain compensation are added
     * so small speakers (smartphones/laptops) can clearly project the pitch.
     */
    function playKalimbaSound(freq) {
      if (!freq || !audioCtx) return;

      const now = audioCtx.currentTime;

      // Dynamic gain boost for lower frequencies
      const isLowNote = freq < 200;
      const volumeBoost = isLowNote ? 1.4 : (freq < 300 ? 1.15 : 1.0);

      // Master gain node
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.001, now);
      masterGain.gain.linearRampToValueAtTime(0.85 * volumeBoost, now + 0.004); 
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + (isLowNote ? 1.8 : 1.4)); 

      // Fundamental tone oscillator (Sine wave)
      const oscFundamental = audioCtx.createOscillator();
      oscFundamental.type = 'sine';
      oscFundamental.frequency.setValueAtTime(freq, now);

      // Body tone oscillator (Triangle wave)
      const oscBody = audioCtx.createOscillator();
      oscBody.type = 'triangle';
      oscBody.frequency.setValueAtTime(freq, now);

      const bodyGain = audioCtx.createGain();
      bodyGain.gain.setValueAtTime(0.4, now);

      // Metallic overtone harmonic
      const tineHarmonic = audioCtx.createOscillator();
      tineHarmonic.type = 'sine';
      tineHarmonic.frequency.setValueAtTime(freq * 3.92, now);

      const tineGain = audioCtx.createGain();
      tineGain.gain.setValueAtTime(0.35, now);
      tineGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

      // CONNECT NODES
      oscFundamental.connect(masterGain);
      oscBody.connect(bodyGain);
      bodyGain.connect(masterGain);
      tineHarmonic.connect(tineGain);
      tineGain.connect(masterGain);

      oscFundamental.start(now);
      oscBody.start(now);
      tineHarmonic.start(now);

      oscFundamental.stop(now + 1.9);
      oscBody.stop(now + 1.9);
      tineHarmonic.stop(now + 0.15);

      // EXTRA HARMONICS FOR LOW NOTES
      if (isLowNote) {
        // 2nd Harmonic (1 octave above)
        const osc2nd = audioCtx.createOscillator();
        osc2nd.type = 'triangle';
        osc2nd.frequency.setValueAtTime(freq * 2, now);

        const gain2nd = audioCtx.createGain();
        gain2nd.gain.setValueAtTime(0.5, now);
        gain2nd.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

        osc2nd.connect(gain2nd);
        gain2nd.connect(masterGain);

        osc2nd.start(now);
        osc2nd.stop(now + 1.3);

        // 3rd Harmonic (Octave + 5th)
        const osc3rd = audioCtx.createOscillator();
        osc3rd.type = 'sine';
        osc3rd.frequency.setValueAtTime(freq * 3, now);

        const gain3rd = audioCtx.createGain();
        gain3rd.gain.setValueAtTime(0.3, now);
        gain3rd.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

        osc3rd.connect(gain3rd);
        gain3rd.connect(masterGain);

        osc3rd.start(now);
        osc3rd.stop(now + 0.9);
      }

      // Output filtering
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(Math.min(freq * 8, 9000), now);

      masterGain.connect(filter);
      filter.connect(audioCtx.destination);
    }

    const NOTE_PRESETS = [
      {
        id: "string_ensemble",
        name: "เสียงเครื่องสาย",
        notes: [
          "มฺ", "ฟฺ", "ซฺ", "ลฺ", "ทฺ",
          "ด", "ร", "ม", "ฟ", "ซ", "ล", "ท",
          "ดํ", "รํ", "มํ", "ฟํ", "ซํ"
        ]
      },
      {
        id: "piphat_ensemble",
        name: "เสียงปี่พาทย์",
        notes: [
          "รฺ", "มฺ", "ฟฺ", "ซฺ", "ลฺ", "ทฺ",
          "ด", "ร", "ม", "ฟ", "ซ", "ล", "ท",
          "ดํ", "รํ", "มํ", "ฟํ"
        ]
      }
    ];

    let activePresetId = "string_ensemble";
    let activeNotes = [...NOTE_PRESETS[0].notes];
    
    const totalKeys = 17;
    let keyStates = new Array(totalKeys).fill(false);

    const canvas = document.getElementById('keysCanvas');
    const ctx = canvas.getContext('2d');
    let keyRects = [];

    function resizeCanvas() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      ctx.scale(dpr, dpr);
      drawCanvas(width, height);
    }

    function drawCanvas(width, height) {
      ctx.clearRect(0, 0, width, height);

      // Background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      // Geometry calculations
      const gapRatio = 0.12; 
      const totalGaps = totalKeys - 1;
      const keyWidth = width / (totalKeys + totalGaps * gapRatio);
      const gapWidth = keyWidth * gapRatio;

      keyRects = [];

      for (let i = 0; i < totalKeys; i++) {
        const x = i * (keyWidth + gapWidth);
        const y = 0;
        const w = keyWidth;
        const h = height;

        keyRects.push({ x, y, w, h, index: i });

        const isPressed = keyStates[i];

        // Red (#DC2626) while pressed down, Gold (#D0B038) otherwise
        ctx.fillStyle = isPressed ? '#DC2626' : '#D0B038';
        ctx.fillRect(x, y, w, h);

        // Render Thai note label
        const labelText = activeNotes[i] || "";
        const fontSize = Math.min(Math.max(14, w * 0.42), height * 0.05);
        ctx.font = `600 ${fontSize}px 'Sarabun', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#000000';

        const textY = height * 0.04;
        ctx.fillText(labelText, x + (w / 2), textY);
      }
    }

    function render() {
      const dpr = window.devicePixelRatio || 1;
      drawCanvas(canvas.width / dpr, canvas.height / dpr);
    }

    function getKeyIndexAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      for (const key of keyRects) {
        if (
          clickX >= key.x &&
          clickX <= key.x + key.w &&
          clickY >= key.y &&
          clickY <= key.y + key.h
        ) {
          return key.index;
        }
      }
      return -1;
    }

    function triggerNoteSound(keyIndex) {
      initAudioContext();
      const noteLabel = activeNotes[keyIndex];
      const freq = getFrequencyForThaiNote(noteLabel);
      if (freq) {
        playKalimbaSound(freq);
      }
    }

    function clearAllStates() {
      let changed = false;
      for (let i = 0; i < totalKeys; i++) {
        if (keyStates[i]) {
          keyStates[i] = false;
          changed = true;
        }
      }
      if (changed) render();
    }

    // Mouse Interaction Handlers
    canvas.addEventListener('mousedown', (e) => {
      initAudioContext();
      const idx = getKeyIndexAt(e.clientX, e.clientY);
      clearAllStates();
      if (idx !== -1) {
        keyStates[idx] = true;
        triggerNoteSound(idx);
        render();
      }
    });

    window.addEventListener('mouseup', () => clearAllStates());

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) {
        const idx = getKeyIndexAt(e.clientX, e.clientY);
        let changed = false;
        for (let i = 0; i < totalKeys; i++) {
          const shouldBeActive = (i === idx);
          if (keyStates[i] !== shouldBeActive) {
            keyStates[i] = shouldBeActive;
            changed = true;
            if (shouldBeActive) {
              triggerNoteSound(i);
            }
          }
        }
        if (changed) render();
      }
    });

    canvas.addEventListener('mouseleave', () => clearAllStates());

    // Touch Interaction Handlers
    function handleTouch(e) {
      e.preventDefault();
      initAudioContext();

      const activeIndices = new Set();

      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        const idx = getKeyIndexAt(touch.clientX, touch.clientY);
        if (idx !== -1) {
          activeIndices.add(idx);
        }
      }

      let changed = false;
      for (let i = 0; i < totalKeys; i++) {
        const shouldBeActive = activeIndices.has(i);
        if (keyStates[i] !== shouldBeActive) {
          keyStates[i] = shouldBeActive;
          changed = true;
          if (shouldBeActive) {
            triggerNoteSound(i);
          }
        }
      }

      if (changed) render();
    }

    canvas.addEventListener('touchstart', handleTouch, { passive: false });
    canvas.addEventListener('touchmove', handleTouch, { passive: false });
    canvas.addEventListener('touchend', handleTouch, { passive: false });
    canvas.addEventListener('touchcancel', handleTouch, { passive: false });

    // Panel UI Handlers
    const openPanelBtn = document.getElementById('openPanelBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const noteModal = document.getElementById('noteModal');
    const presetButtonsContainer = document.getElementById('presetButtonsContainer');

    function renderPresetCards() {
      presetButtonsContainer.innerHTML = '';
      NOTE_PRESETS.forEach((preset) => {
        const isSelected = preset.id === activePresetId;
        
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `w-full text-left p-4 rounded-xl border-2 transition-all flex flex-col gap-2 ${
          isSelected 
            ? 'border-amber-600 bg-amber-50 shadow-md' 
            : 'border-gray-200 hover:border-amber-300 hover:bg-amber-50/50'
        }`;

        const notesPreview = preset.notes.join(' ');

        card.innerHTML = `
          <div class="flex items-center justify-between w-full">
            <span class="font-bold text-base ${isSelected ? 'text-amber-900' : 'text-gray-800'}">
              ${preset.name}
            </span>
            ${isSelected ? `
              <span class="bg-amber-600 text-white text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                กำลังใช้งาน
              </span>
            ` : ''}
          </div>
          <div class="text-xs font-mono text-gray-600 bg-white/80 p-2 rounded-lg border border-gray-100 overflow-x-auto whitespace-nowrap">
            ${notesPreview}
          </div>
        `;

        card.onclick = () => {
          activePresetId = preset.id;
          activeNotes = [...preset.notes];
          render();
          renderPresetCards();
          closeModal();
        };

        presetButtonsContainer.appendChild(card);
      });
    }

    openPanelBtn.addEventListener('click', () => {
      initAudioContext();
      renderPresetCards();
      noteModal.classList.remove('hidden');
    });

    function closeModal() {
      noteModal.classList.add('hidden');
    }

    closePanelBtn.addEventListener('click', closeModal);
    cancelModalBtn.addEventListener('click', closeModal);

    window.addEventListener('resize', resizeCanvas);

    window.onload = function() {
      resizeCanvas();
    };
  </script>
</body>
</html>
